<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bread Addiction Detector 🍞</title>

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    font-family:Arial,sans-serif;

    background:linear-gradient(
        180deg,
        #fff6d5,
        #ffe8a3
    );
}

.card{
    background:white;
    padding:35px;
    border-radius:20px;
    width:85%;
    max-width:500px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    z-index:10;
}

h1{
    margin-top:0;
}

.progress{
    width:100%;
    height:22px;
    background:#eee;
    border-radius:50px;
    overflow:hidden;
}

.bar{
    width:0%;
    height:100%;
    background:#ffb300;
    transition:.3s;
}

#status{
    margin-top:20px;
    font-size:18px;
}

.bread{
    position:absolute;
    font-size:30px;
    animation:floatUp linear infinite;
    opacity:.3;
}

@keyframes floatUp{

    from{
        transform:translateY(100vh);
    }

    to{
        transform:translateY(-120vh);
    }
}

.result{
    font-size:22px;
    line-height:1.8;
}

.big{
    font-size:55px;
}

</style>

</head>
<body>

<div class="card" id="card">

<h1>🍞 Bread Addiction Detector</h1>

<p>
Official Food Analysis System v2.0
</p>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="status">
Initializing scan...
</div>

</div>

<script>

const statuses = [

"Scanning stomach... 🍔",
"Checking food history... 📜",
"Analyzing snack behaviour... 🤨",
"Searching favourite food... 🔍",
"Cross-checking bakery records... 🍞",
"Comparing with global bread database... 🌎",
"Detecting emergency cravings... 🚨",
"Finalizing report... 📊"

];

let progress = 0;

const bar = document.getElementById("bar");
const status = document.getElementById("status");

function updateScan(){

    progress += Math.random()*8;

    bar.style.width = progress + "%";

    const index =
    Math.min(
        statuses.length-1,
        Math.floor(progress/12)
    );

    status.innerHTML = statuses[index];

    if(progress < 100){

        setTimeout(updateScan,350);

    }else{

        showResult();
    }
}

setTimeout(updateScan,500);

function showResult(){

document.getElementById("card").innerHTML = `

<div class="big">🍞</div>

<h1>Analysis Complete</h1>

<div class="result">

Bread Addiction Level:
<b>99.97%</b>

<br><br>

Primary Food:
🍞 Bread

<br>

Secondary Food:
🍞 More Bread

<br>

Emergency Food:
🍞 Extra Bread

<br><br>

Risk Level:
🔴 CRITICAL

<br><br>

Diagnosis:

Patient may start thinking about bread
every 7 minutes.

<br><br>

Recommended Action:

Hide all bakeries within 10km.

😂

</div>

`;

}

function createBread(){

const bread = document.createElement("div");

bread.classList.add("bread");

bread.innerHTML = "🍞";

bread.style.left =
Math.random()*100 + "vw";

bread.style.animationDuration =
(Math.random()*5+5)+"s";

bread.style.fontSize =
(Math.random()*30+20)+"px";

document.body.appendChild(bread);

setTimeout(()=>{
bread.remove();
},10000);

}

setInterval(createBread,400);

</script>

</body>
</html>
